<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>emu-test</title>
<style>body{margin:0;background:#111;color:#fff;font:12px monospace} #emu{position:fixed;left:0;top:0;width:256px;height:384px;opacity:0.01;pointer-events:none}
#out{position:absolute;left:300px;top:0} canvas.v{display:block;width:512px;height:384px;image-rendering:pixelated}</style></head>
<body><div id="emu"></div><div id="out"></div>
<script type="module">
  import { EmuHost } from '/js/emu/host.js';
  import { PlatinumGame } from '/js/emu/platinum.js';
  const rom = new Uint8Array(await (await fetch('/test-rom.nds')).arrayBuffer());
  const save = new Uint8Array(await (await fetch('/test-save.sav')).arrayBuffer());
  const host = new EmuHost({ mount: '#emu', platform: 'nds', dataPath: '/vendor/emulatorjs/', core: new URLSearchParams(location.search).get('core') || undefined });
  const game = new PlatinumGame(host, rom);
  window.T = { host, game, log: [] };
  await host.start(rom, 'Pokemon Platine.nds', save);
  for (const c of [game.topCanvas, game.bottomCanvas]) { c.className = 'v'; document.getElementById('out').append(c); }
  const loop = () => { game.blit(); game.tick(); window.T.state = game.state(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  window.T.ready = true;
</script>
</body></html>
